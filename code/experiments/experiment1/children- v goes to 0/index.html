<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cause &amp; Fault Experiment 1</title>

  <!-- jQuery (required by the proliferate library) -->
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
  <!-- proliferate data-collection library -->
  <script src="https://proliferate.alps.science/static/js/proliferate.js" type="text/javascript"></script>

  <!-- jsPsych 7 core -->
  <script src="https://unpkg.com/jspsych@7.3.4"></script>
  <!-- Plugins -->
  <script src="https://unpkg.com/@jspsych/plugin-html-button-response@1.1.3"></script>
  <script src="https://unpkg.com/@jspsych/plugin-preload@1.1.3"></script>
  <script src="https://unpkg.com/@jspsych/plugin-call-function@1.1.3"></script>
  <!-- jsPsych default styles -->
  <link rel="stylesheet" href="https://unpkg.com/jspsych@7.3.4/css/jspsych.css">
  <!-- Experiment styles -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- jsPsych renders into this div so the debug panel is never wiped -->
  <div id="jspsych-target"></div>
  <!-- proliferate writes upload-status messages here when data is submitted -->
  <div id="thanks" style="text-align:center; font-family:sans-serif; font-size:18px; margin-top:24px;"></div>
  <!-- Custom allocation plugin (must load before experiment.js) -->
  <script src="js/allocation-plugin.js"></script>
  <!-- Main experiment logic -->
  <script src="js/experiment.js"></script>
</body>
</html>
